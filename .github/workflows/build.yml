name: Build

on: [push, pull_request]

permissions: read-all

env:
  XCODE_PROJECT: "Rectangle.xcodeproj"
  XCODE_SCHEME: "Rectangle"
  CODE_SIGN_IDENTITY: "-"
  BUILD_DIR: "build"
  XCODE_ARCHIVE: "Rectangle.xcarchive"
  APP_NAME: "Rectangle.app"
  EXPORT_OPTIONS_PLIST: "exportOptions.plist"
  DMG_NAME: "Rectangle"
  DMG_FILE_NAME: "Rectangle.dmg"

jobs:
  build:
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Test local shortcut package
      run: swift test --package-path LocalPackages/RectangleShortcuts
    - name: Test dependency boundary error handling
      run: bash scripts/test-verify-dependency-boundary.sh
    - name: Verify dependency boundary
      run: bash scripts/verify-dependency-boundary.sh
    - name: Build for testing without running app-hosted tests
      run: >-
        xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
        -configuration Debug -destination "generic/platform=macOS"
        -derivedDataPath "$RUNNER_TEMP/RectangleDerivedData-Debug"
        CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing
    - name: Build unsigned Debug
      run: >-
        xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
        -configuration Debug -destination "generic/platform=macOS"
        -derivedDataPath "$RUNNER_TEMP/RectangleDerivedData-Debug"
        CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
    - name: Build unsigned Release
      run: >-
        xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
        -configuration Release -destination "generic/platform=macOS"
        -derivedDataPath "$RUNNER_TEMP/RectangleDerivedData-Release"
        CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
    - name: Build
      run: xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" archive CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" -archivePath "$BUILD_DIR/$XCODE_ARCHIVE"
    - name: Export
      run: |
        plutil -convert xml1 - -o "$EXPORT_OPTIONS_PLIST" << EOF
          {
            "destination": "export",
            "method": "mac-application"
          }
        EOF

        xcodebuild -exportArchive -archivePath "$BUILD_DIR/$XCODE_ARCHIVE" -exportPath "$BUILD_DIR" -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"
    - name: Resign App
      run: codesign --force --deep -s "$CODE_SIGN_IDENTITY" "$BUILD_DIR/$APP_NAME"
    - name: Inspect packaged app dependency boundary
      run: bash scripts/verify-dependency-boundary.sh "$BUILD_DIR/$APP_NAME"
    - name: Make DMG
      run: hdiutil create -srcdir "$BUILD_DIR" -volname "$DMG_NAME" "$DMG_FILE_NAME"
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Build
        path: ${{ env.DMG_FILE_NAME }}
